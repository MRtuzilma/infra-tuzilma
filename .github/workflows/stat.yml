name: stat.uz ma'lumotlarini yangilash
on:
  schedule:
    - cron: '17 4 3 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/stat-update.js
      - name: Saqlash
        run: |
          if git diff --quiet stat.json; then echo "o'zgarish yo'q"; exit 0; fi
          git config user.name "stat-yangilash"
          git config user.email "actions@users.noreply.github.com"
          git add stat.json
          git commit -m "stat.uz ma'lumotlari yangilandi"
          git push origin HEAD:main HEAD:gh-pages
